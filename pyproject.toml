[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lg-ac-desktop"
version = "0.1.0"
description = "Desktop app to control an LG ThinQ air conditioner"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "thinqconnect>=1.0.14",
    "PySide6>=6.7",
    "aiohttp>=3.9",
]

[project.scripts]
lg-ac = "lg_ac.app:main"
lg-ac-cli = "lg_ac.cli:main"

[tool.setuptools]
packages = ["lg_ac"]

[tool.setuptools.package-data]
lg_ac = ["icons/*.svg", "qml/*.qml"]
